name: Build Embedded XR Profile

on:
  push:
    paths:
      - 'assets/Loading Image.jpeg'
      - 'assets/xr-loading-screen.svg'
      - '.github/workflows/embed-xr-profile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build new XR loading SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          image = Path('assets/Loading Image.jpeg')
          data = base64.b64encode(image.read_bytes()).decode('ascii')

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 970">
          <defs>
            <radialGradient id="bg"><stop stop-color="#07182a"/><stop offset="1" stop-color="#01060d"/></radialGradient>
            <linearGradient id="cyan"><stop stop-color="#00bfff"/><stop offset=".5" stop-color="#00ffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
            <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#0780a5" opacity=".35"/></pattern>
            <clipPath id="photoClip"><rect x="490" y="82" width="556" height="620" rx="28"/></clipPath>
            <mask id="photoReveal"><rect x="490" y="82" width="556" height="620" fill="black"/><rect x="490" y="82" width="0" height="620" fill="white"><animate attributeName="width" values="0;556" dur="8s" fill="freeze"/></rect></mask>
          </defs>

          <rect width="1536" height="970" fill="url(#bg)"/>
          <rect x="20" y="20" width="1496" height="930" fill="url(#dots)" opacity=".55"/>

          <g fill="#52dfff" font-family="monospace">
            <text x="72" y="110" font-size="30" font-weight="bold" letter-spacing="5">XR PROFILE // INITIALIZING</text>
            <text x="72" y="166" font-size="20" letter-spacing="3">SPATIAL COMPUTING</text>
            <text x="72" y="202" font-size="20" letter-spacing="3">REAL-TIME 3D</text>
            <text x="72" y="238" font-size="20" letter-spacing="3">COMPUTER VISION</text>
            <text x="72" y="274" font-size="20" letter-spacing="3">AR / VR / MR</text>
            <text x="1190" y="110" font-size="30" font-weight="bold" letter-spacing="4">VIGNESHWARAN B</text>
            <text x="1190" y="166" font-size="20" letter-spacing="3">UNITY DEVELOPER</text>
            <text x="1190" y="202" font-size="20" letter-spacing="3">XR ENGINEER</text>
            <text x="1190" y="238" font-size="20" letter-spacing="3">INTERACTIVE EXPERIENCES</text>
            <text x="1190" y="274" font-size="20" letter-spacing="3">BUILDING IMMERSIVE WORLDS</text>
          </g>

          <rect x="480" y="72" width="576" height="640" rx="36" fill="#00101c" stroke="#00dfff" stroke-width="4" filter="url(#glow)"/>
          <rect x="490" y="82" width="556" height="620" rx="28" fill="#010509"/>
          <g clip-path="url(#photoClip)">
            <image href="data:image/jpeg;base64,{data}" x="490" y="82" width="556" height="620" preserveAspectRatio="xMidYMid meet" mask="url(#photoReveal)"/>
          </g>

          <!-- One-time vertical reveal scanner; stops at 100% -->
          <rect x="490" y="82" width="4" height="620" fill="#ffffff" filter="url(#glow)">
            <animate attributeName="x" values="490;1046" dur="8s" fill="freeze"/>
          </rect>

          <g fill="none" stroke="#00eaff" stroke-width="5" filter="url(#glow)">
            <path d="M458 126V82H505M1078 126V82H1033M458 658V702H505M1078 658V702H1033"/>
          </g>

          <g fill="#55ddff" font-family="monospace" font-size="18" letter-spacing="2">
            <text x="72" y="650">■ CORE ONLINE</text><text x="72" y="682">■ ASSETS LOADING</text><text x="72" y="714">■ PROFILE SYNC</text><text x="72" y="746">■ READY SOON</text>
            <text x="1190" y="650">● UNITY READY</text><text x="1190" y="682">● XR PIPELINE READY</text><text x="1190" y="714">● MODULES LOADED</text><text x="1190" y="746">● PROFILE READY</text>
          </g>

          <g font-family="monospace" text-anchor="middle">
            <text x="768" y="780" fill="#ffffff" font-size="52" font-weight="bold" letter-spacing="9">LOADING...</text>
            <text x="768" y="814" fill="#61eaff" font-size="19" letter-spacing="6">REVEALING XR PROFILE</text>
          </g>

          <rect x="250" y="838" width="1036" height="28" rx="14" fill="#06131f" stroke="#00dfff" stroke-width="2"/>
          <rect x="257" y="845" width="0" height="14" rx="7" fill="url(#cyan)">
            <animate attributeName="width" values="0;1022" dur="8s" fill="freeze"/>
          </rect>

          <g font-family="monospace" font-size="18" fill="#55ddff">
            <text x="260" y="898">0%</text><text x="465" y="898">20%</text><text x="670" y="898">40%</text><text x="875" y="898">60%</text><text x="1080" y="898">80%</text><text x="1280" y="898" text-anchor="end">100%</text>
          </g>

          <g font-family="monospace" font-size="18" text-anchor="middle">
            <rect x="350" y="920" width="170" height="38" rx="10" fill="#07131f" stroke="#147da8"/><text x="435" y="945" fill="#b8f6ff">XR ENGINEER</text>
            <rect x="545" y="920" width="220" height="38" rx="10" fill="#07131f" stroke="#147da8"/><text x="655" y="945" fill="#b8f6ff">SPATIAL COMPUTING</text>
            <rect x="790" y="920" width="200" height="38" rx="10" fill="#07131f" stroke="#147da8"/><text x="890" y="945" fill="#b8f6ff">REAL-TIME 3D</text>
            <rect x="1015" y="920" width="215" height="38" rx="10" fill="#07131f" stroke="#147da8"/><text x="1122" y="945" fill="#b8f6ff">COMPUTER VISION</text>
          </g>
          </svg>'''

          Path('assets/xr-loading-screen.svg').write_text(svg, encoding='utf-8')
          Path('assets/xr-loading-screen-embedded.svg').write_text(svg, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('assets/xr-loading-screen-embedded.svg?v=4', 'assets/xr-loading-screen-embedded.svg?v=5')
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Commit final XR design
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/xr-loading-screen.svg assets/xr-loading-screen-embedded.svg README.md
          git diff --cached --quiet || git commit -m 'Make XR profile reveal stop at 100 percent'
          git push
