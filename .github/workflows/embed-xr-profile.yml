name: Build XR Profile Template
on:
  push:
    paths: ['assets/Loading Image.jpeg','.github/workflows/embed-xr-profile.yml','README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet Pillow
      - name: Build XR profile assets
        run: |
          cat > /tmp/build.py <<'PY'
          import base64,re
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont,ImageFilter,ImageEnhance
          src=Path('assets/Loading Image.jpeg'); raw=base64.b64encode(src.read_bytes()).decode()
          labels=''.join(f'<text x="{180+i*124}" y="840" text-anchor="middle">{i*10}%</text>' for i in range(11))
          svg=f'''<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg"><stop stop-color="#020914"/><stop offset="1" stop-color="#061522"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#0b6078" opacity=".55"/></pattern><clipPath id="c"><rect x="330" y="95" width="860" height="560" rx="28"/></clipPath></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#p)"/><g font-family="DejaVu Sans Mono,monospace" letter-spacing="2"><text x="40" y="82" fill="#39e5ff" font-size="32" font-weight="700">XR PROFILE</text><g fill="#f5ffff" font-size="22"><text x="40" y="158">SPATIAL COMPUTING</text><text x="40" y="202">REAL-TIME 3D</text><text x="40" y="246">COMPUTER VISION</text><text x="40" y="290">AR / VR / MR</text><text x="1260" y="82" font-size="27" font-weight="700">VIGNESHWARAN B</text><text x="1260" y="158" font-size="20">UNITY DEVELOPER</text><text x="1260" y="202" font-size="20">XR AI ENGINEER</text><text x="1260" y="246" font-size="20">INTERACTIVE EXPERIENCES</text><text x="1260" y="290" font-size="20">BUILDING IMMERSIVE WORLDS</text></g></g><g filter="url(#g)"><rect x="320" y="85" width="880" height="580" rx="38" fill="#03101b" stroke="#39e5ff" stroke-width="6"/></g><g stroke="#39e5ff" stroke-width="9" fill="none"><path d="M320 150V115Q320 85 350 85H410"/><path d="M1110 85H1170Q1200 85 1200 115V150"/><path d="M320 600V635Q320 665 350 665H410"/><path d="M1110 665H1170Q1200 665 1200 635V600"/></g><rect x="330" y="95" width="860" height="560" rx="28" fill="#000b13"/><image x="330" y="95" width="860" height="560" preserveAspectRatio="xMidYMid slice" clip-path="url(#c)" href="data:image/jpeg;base64,{raw}"/><rect x="330" y="95" width="860" height="560" rx="28" fill="none" stroke="#0ce0ff" stroke-width="3"/><g font-family="DejaVu Sans Mono,monospace" font-size="20" fill="#39e5ff"><text x="40" y="500">■ CORE ONLINE</text><text x="40" y="536">■ ASSETS LOADED</text><text x="40" y="572">■ PROFILE SYNC</text><text x="40" y="608">■ READY SOON</text><text x="1260" y="500">● UNITY READY</text><text x="1260" y="536">● XR PIPELINE READY</text><text x="1260" y="572">● MODULES LOADED</text><text x="1260" y="608">● PROFILE READY</text></g><text x="800" y="705" fill="#f8ffff" font-family="DejaVu Sans Mono,monospace" font-size="48" font-weight="700" letter-spacing="7" text-anchor="middle">LOADING...</text><text x="656" y="743" fill="#39e5ff" font-family="DejaVu Sans Mono,monospace" font-size="21" text-anchor="start">REVEALING XR PROFILE</text><rect x="180" y="775" width="1240" height="26" rx="13" fill="#061522" stroke="#39e5ff" stroke-width="3"/><g fill="#39e5ff" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="600">{labels}</g></svg>'''
          Path('assets/xr-loading-screen.svg').write_text(svg); Path('assets/xr-loading-screen-embedded.svg').write_text(svg)
          W,H=1600,900; fw,fh=860,560
          photo=Image.open(src).convert('RGB'); photo=ImageEnhance.Sharpness(ImageEnhance.Contrast(photo).enhance(1.04)).enhance(1.15)
          scale=max(fw/photo.width,fh/photo.height); photo=photo.resize((round(photo.width*scale),round(photo.height*scale)),Image.Resampling.LANCZOS); l=(photo.width-fw)//2; t=(photo.height-fh)//2; photo=photo.crop((l,t,l+fw,t+fh))
          mono='/usr/share/fonts/truetype/dejavu/'; f=ImageFont.truetype(mono+'DejaVuSansMono.ttf',20); fb=ImageFont.truetype(mono+'DejaVuSansMono-Bold.ttf',32); fl=ImageFont.truetype(mono+'DejaVuSansMono-Bold.ttf',48); fs=ImageFont.truetype(mono+'DejaVuSansMono.ttf',16)
          frames=[]; cyan=(57,229,255); white=(245,255,255)
          for k in range(26):
            q=k/25; im=Image.new('RGB',(W,H),(2,9,17)); d=ImageDraw.Draw(im)
            for y in range(0,H,28):
              for x in range(0,W,28): d.point((x,y),fill=(5,45,61))
            d.text((40,34),'XR PROFILE',font=fb,fill=cyan); d.text((40,76),'SPATIAL COMPUTING',font=f,fill=white); d.text((40,113),'REAL-TIME 3D',font=f,fill=white); d.text((40,150),'COMPUTER VISION',font=f,fill=white); d.text((40,187),'AR / VR / MR',font=f,fill=white); d.text((1260,34),'VIGNESHWARAN B',font=fb,fill=white); d.text((1260,76),'UNITY DEVELOPER',font=f,fill=white); d.text((1260,113),'XR AI ENGINEER',font=f,fill=white); d.text((1260,150),'INTERACTIVE EXPERIENCES',font=f,fill=white); d.text((1260,187),'BUILDING IMMERSIVE WORLDS',font=f,fill=white)
            d.rounded_rectangle((320,85,1200,665),38,fill=(3,16,27),outline=cyan,width=6); d.rounded_rectangle((330,95,1190,655),28,fill=(0,11,19),outline=cyan,width=3)
            mask=Image.new('L',(W,H)); md=ImageDraw.Draw(mask); md.rectangle((330,95,330+int(fw*q),655),fill=255); layer=Image.new('RGB',(W,H)); layer.paste(photo,(330,95)); im.paste(layer,(0,0),mask); d=ImageDraw.Draw(im); d.rounded_rectangle((330,95,1190,655),28,outline=cyan,width=3)
            if q<1:
              sx=330+int(fw*q); gl=Image.new('RGBA',(W,H)); gd=ImageDraw.Draw(gl); gd.line((sx,95,sx,655),fill=(*cyan,255),width=6); gd.line((sx-14,95,sx+14,655),fill=(*cyan,70),width=16); im=Image.alpha_composite(im.convert('RGBA'),gl.filter(ImageFilter.GaussianBlur(4))).convert('RGB'); d=ImageDraw.Draw(im)
            for j,s in enumerate(['■ CORE ONLINE','■ ASSETS LOADED','■ PROFILE SYNC','■ READY SOON']): d.text((40,500+j*36),s,font=f,fill=cyan)
            for j,s in enumerate(['● UNITY READY','● XR PIPELINE READY','● MODULES LOADED','● PROFILE READY']): d.text((1260,500+j*36),s,font=f,fill=cyan)
            d.text((800,705),'LOADING...',font=fl,fill=white,anchor='mm'); d.text((656,743),'REVEALING XR PROFILE',font=f,fill=cyan,anchor='lm'); d.rounded_rectangle((180,775,1420,801),13,fill=(6,21,34),outline=cyan,width=3); d.rounded_rectangle((188,783,188+int(1224*q),793),5,fill=cyan)
            for i in range(11): d.text((180+i*124,840),f'{i*10}%',font=fs,fill=cyan,anchor='mm')
            frames.append(im.quantize(colors=256,dither=Image.Dither.NONE))
          frames[0].save('assets/xr-profile-loading.gif',save_all=True,append_images=frames[1:],duration=280,disposal=2,optimize=True,loop=None)
          # Small, compact identity + What I Do GIF with drawn icons (no emoji font dependency)
          SW,SH=980,760; cyan=(57,229,255); white=(245,255,255); purple=(210,100,255); orange=(255,145,35); blue=(45,150,255)
          mono='/usr/share/fonts/truetype/dejavu/'; title=ImageFont.truetype(mono+'DejaVuSansMono-Bold.ttf',38); role=ImageFont.truetype(mono+'DejaVuSansMono-Bold.ttf',18); sub=ImageFont.truetype(mono+'DejaVuSansMono.ttf',15); cardtitle=ImageFont.truetype(mono+'DejaVuSansMono-Bold.ttf',16); small=ImageFont.truetype(mono+'DejaVuSansMono.ttf',12)
          def icon(d,x,y,kind,col,scale=1):
            if kind=='vr':
              d.rounded_rectangle((x-42*scale,y-24*scale,x+42*scale,y+24*scale),14*scale,outline=col,width=max(2,int(4*scale))); d.line((x-25*scale,y+24*scale,x-32*scale,y+34*scale),fill=col,width=max(2,int(3*scale))); d.line((x+25*scale,y+24*scale,x+32*scale,y+34*scale),fill=col,width=max(2,int(3*scale))); d.line((x-12*scale,y,x+12*scale,y),fill=col,width=max(2,int(3*scale)))
            elif kind=='unity':
              pts=[(x,y-42*scale),(x+37*scale,y-20*scale),(x+28*scale,y+30*scale),(x,y+42*scale),(x-28*scale,y+30*scale),(x-37*scale,y-20*scale)]; d.line(pts+[pts[0]],fill=col,width=max(2,int(4*scale))); d.line((x-28*scale,y+30*scale,x+8*scale,y-5*scale,x+37*scale,y-20*scale),fill=col,width=max(2,int(3*scale)))
            elif kind=='brain':
              d.arc((x-42*scale,y-40*scale,x+5*scale,y+40*scale),90,270,fill=col,width=max(2,int(4*scale))); d.arc((x-5*scale,y-40*scale,x+42*scale,y+40*scale),270,90,fill=col,width=max(2,int(4*scale))); d.line((x,y-40*scale,x,y+40*scale),fill=col,width=max(2,int(3*scale))); d.arc((x-30*scale,y-18*scale,x,y+8*scale),270,90,fill=col,width=max(2,int(2*scale))); d.arc((x,y-8*scale,x+30*scale,y+18*scale),90,270,fill=col,width=max(2,int(2*scale)))
            elif kind=='cube':
              pts=[(x,y-34*scale),(x+34*scale,y-14*scale),(x+34*scale,y+25*scale),(x,y+44*scale),(x-34*scale,y+25*scale),(x-34*scale,y-14*scale)]; d.line(pts+[pts[0]],fill=col,width=max(2,int(4*scale))); d.line((x,y-34*scale,x,y+44*scale),fill=col,width=max(2,int(3*scale))); d.line((x-34*scale,y-14*scale,x,y+5*scale,x+34*scale,y-14*scale),fill=col,width=max(2,int(3*scale)))
            elif kind=='crane':
              d.line((x-42*scale,y+35*scale,x+42*scale,y+35*scale),fill=col,width=max(2,int(4*scale))); d.line((x-32*scale,y+35*scale,x-32*scale,y-32*scale,x+34*scale,y-32*scale),fill=col,width=max(2,int(4*scale))); d.line((x+15*scale,y-32*scale,x+15*scale,y+12*scale),fill=col,width=max(2,int(3*scale))); d.arc((x+7*scale,y+10*scale,x+23*scale,y+27*scale),0,180,fill=col,width=max(2,int(3*scale)))
            elif kind=='vision':
              d.ellipse((x-44*scale,y-28*scale,x+44*scale,y+28*scale),outline=col,width=max(2,int(4*scale))); d.ellipse((x-15*scale,y-15*scale,x+15*scale,y+15*scale),outline=col,width=max(2,int(4*scale)))
          def identity_frame(step):
            im=Image.new('RGB',(SW,SH),(2,9,17)); d=ImageDraw.Draw(im)
            for y in range(0,SH,28):
              for x in range(0,SW,28): d.point((x,y),fill=(5,45,61))
            d.text((SW//2,38),'HI, I\'M',font=sub,fill=cyan,anchor='mm'); d.text((SW//2,78),'VIGNESHWARAN B',font=title,fill=white,anchor='mm')
            roles=[('vr','XR ENGINEER',cyan,170),('unity','UNITY DEVELOPER',white,490),('brain','XR AI ENGINEER',cyan,810)]
            for kind,label,col,x in roles: icon(d,x,145,kind,col,.72); d.text((x,207),label,font=role,fill=white,anchor='mm')
            d.text((SW//2,265),'⚡  WHAT I DO',font=title,fill=cyan,anchor='mm')
            cards=[('vr','XR DEVELOPMENT','AR  •  VR  •  MR','Unity  •  OpenXR',cyan),('vision','XR + AI','Computer Vision','AI  •  Hand Tracking',purple),('cube','REAL-TIME 3D','Interactive Experiences','Spatial Computing',blue),('crane','INDUSTRIAL XR','Training  •  Maintenance','Safety',orange)]
            xs=[24,266,508,750]
            for x,(kind,a,b,c,col) in zip(xs,cards):
              d.rounded_rectangle((x,315,x+206,610),16,fill=(4,14,25),outline=col,width=3); icon(d,x+103,372,kind,col,.55); d.text((x+103,443),a,font=cardtitle,fill=col,anchor='mm'); d.text((x+103,492),b,font=small,fill=white,anchor='mm'); d.text((x+103,516),c,font=small,fill=white,anchor='mm'); d.rounded_rectangle((x+72,570,x+134,575),3,fill=col)
            d.text((SW//2,690),'BUILDING IMMERSIVE WORLDS',font=sub,fill=cyan,anchor='mm')
            sy=int((step/7)*(SH-1)); glow=Image.new('RGBA',(SW,SH)); gd=ImageDraw.Draw(glow); gd.line((0,sy,SW,sy),fill=(*cyan,55),width=2); im=Image.alpha_composite(im.convert('RGBA'),glow.filter(ImageFilter.GaussianBlur(3))).convert('RGB'); return im.quantize(colors=256,dither=Image.Dither.NONE)
          idframes=[identity_frame(i) for i in range(8)]; idframes[0].save('assets/xr-identity-what-i-do.gif',save_all=True,append_images=idframes[1:],duration=220,disposal=2,optimize=True,loop=0)
          p=Path('README.md'); s=p.read_text(); s=re.sub(r'<img src="https://raw\.githubusercontent\.com/VigneshwaranECE/VigneshwaranECE/main/assets/xr-profile-loading\.gif(?:\?v=[^"]+)?"[^>]*>', '<img src="https://raw.githubusercontent.com/VigneshwaranECE/VigneshwaranECE/main/assets/xr-profile-loading.gif?v=xrai6" width="100%" alt="XR profile scanning animation" />', s, count=1); p.write_text(s)
          PY
          python3 /tmp/build.py
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/xr-loading-screen.svg assets/xr-loading-screen-embedded.svg assets/xr-profile-loading.gif assets/xr-identity-what-i-do.gif README.md
          git diff --cached --quiet || git commit -m 'Regenerate compact XR identity GIF with icons'
          git push
