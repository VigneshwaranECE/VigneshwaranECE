name: Build XR Profile Scan Animation

on:
  push:
    paths:
      - 'assets/Loading Image.jpeg'
      - '.github/workflows/embed-xr-profile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python3 -m pip install --quiet Pillow

      - name: Build SVG template and animated scan GIF
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          src=Path('assets/Loading Image.jpeg')
          raw=base64.b64encode(src.read_bytes()).decode('ascii')

          # SVG keeps the full-photo template. GIF provides the scan animation on GitHub,
          # because GitHub renders SVGs without inline animation.
          svg=f'''<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020914"/><stop offset="1" stop-color="#061522"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="photoClip"><rect x="535" y="115" width="530" height="555" rx="24"/></clipPath><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#0b6078" opacity=".55"/></pattern></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><g fill="none" stroke="#08728f" stroke-width="2" opacity=".7"><path d="M0 75H250L300 25H455"/><path d="M1600 75H1350L1300 25H1145"/><path d="M0 825H250L300 875H455"/><path d="M1600 825H1350L1300 875H1145"/></g><g font-family="DejaVu Sans Mono,monospace" letter-spacing="2"><text x="15" y="82" fill="#39e5ff" font-size="36" font-weight="700">XR PROFILE</text><rect x="15" y="104" width="125" height="7" rx="3" fill="#39e5ff"/><g fill="#f5ffff" font-size="26" font-weight="600"><text x="15" y="158">SPATIAL COMPUTING</text><text x="15" y="202">REAL-TIME 3D</text><text x="15" y="246">COMPUTER VISION</text><text x="15" y="290">AR / VR / MR</text></g><text x="1190" y="82" fill="#f5ffff" font-size="32" font-weight="700">VIGNESHWARAN B</text><rect x="1190" y="104" width="125" height="7" rx="3" fill="#39e5ff"/><g fill="#f5ffff" font-size="25" font-weight="600"><text x="1190" y="158">UNITY DEVELOPER</text><text x="1190" y="202">XR ENGINEER</text><text x="1190" y="246">INTERACTIVE EXPERIENCES</text><text x="1190" y="290">BUILDING IMMERSIVE WORLDS</text></g></g><g filter="url(#glow)"><rect x="525" y="105" width="550" height="575" rx="32" fill="#03101b" stroke="#39e5ff" stroke-width="5"/></g><g stroke="#39e5ff" stroke-width="8" fill="none"><path d="M525 160V125Q525 105 545 105H590"/><path d="M1010 105H1055Q1075 105 1075 125V160"/><path d="M525 625V660Q525 680 545 680H590"/><path d="M1010 680H1055Q1075 680 1075 660V625"/></g><rect x="535" y="115" width="530" height="555" rx="24" fill="#000b13"/><image x="535" y="115" width="530" height="555" preserveAspectRatio="xMidYMid meet" clip-path="url(#photoClip)" href="data:image/jpeg;base64,{raw}"/><rect x="535" y="115" width="530" height="555" rx="24" fill="none" stroke="#0ce0ff" stroke-width="3"/><g font-family="DejaVu Sans Mono,monospace" font-size="24" font-weight="600" letter-spacing="2" fill="#39e5ff"><text x="15" y="490">■ CORE ONLINE</text><text x="15" y="534">■ ASSETS LOADED</text><text x="15" y="578">■ PROFILE SYNC</text><text x="15" y="622">■ READY SOON</text><text x="1190" y="490">● UNITY READY</text><text x="1190" y="534">● XR PIPELINE READY</text><text x="1190" y="578">● MODULES LOADED</text><text x="1190" y="622">● PROFILE READY</text></g><g font-family="DejaVu Sans Mono,monospace" text-anchor="middle"><text x="800" y="735" fill="#f8ffff" font-size="52" font-weight="700" letter-spacing="9">LOADING...</text><text x="800" y="775" fill="#39e5ff" font-size="25" font-weight="600" letter-spacing="5">REVEALING XR PROFILE</text></g><rect x="180" y="815" width="1240" height="24" rx="12" fill="#061522" stroke="#39e5ff" stroke-width="3"/><rect x="187" y="822" width="620" height="10" rx="5" fill="#39e5ff" filter="url(#glow)"/><g font-family="DejaVu Sans Mono,monospace" font-size="20" font-weight="600" fill="#39e5ff" text-anchor="middle"><text x="180" y="870">0%</text><text x="428" y="870">20%</text><text x="676" y="870">40%</text><text x="924" y="870">60%</text><text x="1172" y="870">80%</text><text x="1420" y="870">100%</text></g></svg>'''
          Path('assets/xr-loading-screen.svg').write_text(svg,encoding='utf-8')
          Path('assets/xr-loading-screen-embedded.svg').write_text(svg,encoding='utf-8')

          W,H=1200,675
          im0=Image.new('RGB',(W,H),(2,9,17))
          photo=Image.open(src).convert('RGB')
          # Center portrait in the same rectangular template.
          frame=(400,86,800,505)
          fw,fh=frame[2]-frame[0],frame[3]-frame[1]
          scale=min(fw/photo.width,fh/photo.height)
          photo=photo.resize((round(photo.width*scale),round(photo.height*scale)),Image.Resampling.LANCZOS)
          pp=((fw-photo.width)//2,(fh-photo.height)//2)
          fonts='/usr/share/fonts/truetype/dejavu/'
          F1=ImageFont.truetype(fonts+'DejaVuSansMono-Bold.ttf',25); F2=ImageFont.truetype(fonts+'DejaVuSansMono.ttf',17); F3=ImageFont.truetype(fonts+'DejaVuSansMono-Bold.ttf',30); F4=ImageFont.truetype(fonts+'DejaVuSansMono-Bold.ttf',39)
          frames=[]
          for k in range(26):
              p=k/25
              reveal=min(1,p/0.82)
              im=im0.copy(); d=ImageDraw.Draw(im); cyan=(57,229,255); white=(245,255,255)
              # subtle HUD background
              for y in range(0,H,18):
                  for x in range(0,W,18): d.point((x,y),fill=(5,45,61))
              d.text((18,27),'XR PROFILE',font=F3,fill=cyan); d.text((18,65),'SPATIAL COMPUTING',font=F2,fill=white); d.text((18,91),'REAL-TIME 3D',font=F2,fill=white); d.text((18,117),'COMPUTER VISION',font=F2,fill=white); d.text((18,143),'AR / VR / MR',font=F2,fill=white)
              d.text((895,27),'VIGNESHWARAN B',font=F3,fill=white); d.text((895,65),'UNITY DEVELOPER',font=F2,fill=white); d.text((895,91),'XR ENGINEER',font=F2,fill=white); d.text((895,117),'INTERACTIVE EXPERIENCES',font=F2,fill=white); d.text((895,143),'BUILDING IMMERSIVE WORLDS',font=F2,fill=white)
              d.rounded_rectangle((390,76,810,515),25,fill=(3,16,27),outline=cyan,width=4)
              d.rounded_rectangle((400,86,800,505),18,fill=(0,11,19),outline=cyan,width=2)
              layer=Image.new('RGB',(W,H)); layer.paste(photo,(400+pp[0],86+pp[1])); mask=Image.new('L',(W,H),0); md=ImageDraw.Draw(mask); mask_right=400+int(fw*reveal); md.rectangle((400,86,mask_right,505),fill=255); im.paste(layer,(0,0),mask)
              d=ImageDraw.Draw(im)
              d.rounded_rectangle((400,86,800,505),18,outline=cyan,width=2)
              if reveal<1:
                  sx=400+int(fw*reveal); glow=Image.new('RGBA',(W,H),(0,0,0,0)); gd=ImageDraw.Draw(glow); gd.line((sx,86,sx,505),fill=(57,229,255,255),width=4); gd.line((sx-8,86,sx+8,505),fill=(57,229,255,90),width=10); glow=glow.filter(ImageFilter.GaussianBlur(3)); im=Image.alpha_composite(im.convert('RGBA'),glow).convert('RGB'); d=ImageDraw.Draw(im)
              for j,s in enumerate(['■ CORE ONLINE','■ ASSETS LOADING','■ PROFILE SYNC','■ READY SOON']): d.text((18,405+j*26),s,font=F2,fill=cyan)
              for j,s in enumerate(['● UNITY READY','● XR PIPELINE READY','● MODULES LOADED','● PROFILE READY']): d.text((895,405+j*26),s,font=F2,fill=cyan)
              d.text((600,550),'LOADING...',font=F4,fill=white,anchor='mm'); d.text((600,580),'REVEALING XR PROFILE',font=F2,fill=cyan,anchor='mm')
              d.rounded_rectangle((140,610,1060,630),10,fill=(6,21,34),outline=cyan,width=2); d.rounded_rectangle((146,616,146+int(908*reveal),624),4,fill=cyan)
              for x,s in zip([140,324,508,692,876,1060],['0%','20%','40%','60%','80%','100%']): d.text((x,650),s,font=F2,fill=cyan,anchor='mm')
              frames.append(im.convert('P',palette=Image.Palette.ADAPTIVE,colors=128))
          frames[-1]=frames[-1].copy()
          frames[0].save('assets/xr-profile-loading.gif',save_all=True,append_images=frames[1:],duration=300,disposal=2,optimize=True,loop=None)

          readme=Path('README.md'); text=readme.read_text(encoding='utf-8')
          import re
          text=re.sub(r'<img src="https://raw\.githubusercontent\.com/VigneshwaranECE/VigneshwaranECE/main/assets/(?:xr-profile-loading\.gif|xr-loading-screen(?:-embedded)?\.svg)(?:\?v=[^"]+)?"[^>]*>', '<img src="https://raw.githubusercontent.com/VigneshwaranECE/VigneshwaranECE/main/assets/xr-profile-loading.gif?v=scan2" width="100%" alt="XR profile scanning animation" />', text, count=1)
          readme.write_text(text,encoding='utf-8')
          PY

      - name: Commit scan animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/xr-loading-screen.svg assets/xr-loading-screen-embedded.svg assets/xr-profile-loading.gif README.md
          git diff --cached --quiet || git commit -m 'Restore XR scanning reveal animation'
          git push
