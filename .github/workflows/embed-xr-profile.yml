name: Build XR Profile Template
on:
  push:
    paths: ['assets/Loading Image.jpeg','.github/workflows/embed-xr-profile.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet Pillow
      - name: Generate wider XR SVG and GIF
        run: |
          cat > /tmp/build.py <<'PY'
          import base64,re
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont,ImageFilter,ImageEnhance
          src=Path('assets/Loading Image.jpeg'); raw=base64.b64encode(src.read_bytes()).decode()
          # Wider central photo box: 860px wide x 560px high.
          svg=f'''<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg"><stop stop-color="#020914"/><stop offset="1" stop-color="#061522"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#0b6078" opacity=".55"/></pattern><clipPath id="c"><rect x="370" y="95" width="860" height="560" rx="28"/></clipPath></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#p)"/><g font-family="DejaVu Sans Mono,monospace" letter-spacing="2"><text x="40" y="82" fill="#39e5ff" font-size="38" font-weight="700">XR PROFILE</text><g fill="#f5ffff" font-size="28"><text x="40" y="158">SPATIAL COMPUTING</text><text x="40" y="202">REAL-TIME 3D</text><text x="40" y="246">COMPUTER VISION</text><text x="40" y="290">AR / VR / MR</text><text x="1260" y="82" font-size="32" font-weight="700">VIGNESHWARAN B</text><text x="1260" y="158" font-size="25">UNITY DEVELOPER</text><text x="1260" y="202" font-size="25">XR ENGINEER</text><text x="1260" y="246" font-size="25">INTERACTIVE EXPERIENCES</text><text x="1260" y="290" font-size="25">BUILDING IMMERSIVE WORLDS</text></g></g><g filter="url(#g)"><rect x="360" y="85" width="880" height="580" rx="38" fill="#03101b" stroke="#39e5ff" stroke-width="6"/></g><g stroke="#39e5ff" stroke-width="9" fill="none"><path d="M360 150V115Q360 85 390 85H450"/><path d="M1150 85H1210Q1240 85 1240 115V150"/><path d="M360 600V635Q360 665 390 665H450"/><path d="M1150 665H1210Q1240 665 1240 635V600"/></g><rect x="370" y="95" width="860" height="560" rx="28" fill="#000b13"/><image x="370" y="95" width="860" height="560" preserveAspectRatio="xMidYMid slice" clip-path="url(#c)" href="data:image/jpeg;base64,{raw}"/><rect x="370" y="95" width="860" height="560" rx="28" fill="none" stroke="#0ce0ff" stroke-width="3"/><g font-family="DejaVu Sans Mono,monospace" font-size="25" fill="#39e5ff"><text x="40" y="500">■ CORE ONLINE</text><text x="40" y="536">■ ASSETS LOADED</text><text x="40" y="572">■ PROFILE SYNC</text><text x="40" y="608">■ READY SOON</text><text x="1260" y="500">● UNITY READY</text><text x="1260" y="536">● XR PIPELINE READY</text><text x="1260" y="572">● MODULES LOADED</text><text x="1260" y="608">● PROFILE READY</text></g><text x="800" y="705" fill="#f8ffff" font-family="DejaVu Sans Mono,monospace" font-size="56" font-weight="700" letter-spacing="9" text-anchor="middle">LOADING...</text><text x="800" y="743" fill="#39e5ff" font-family="DejaVu Sans Mono,monospace" font-size="26" text-anchor="middle">REVEALING XR PROFILE</text><rect x="180" y="775" width="1240" height="26" rx="13" fill="#061522" stroke="#39e5ff" stroke-width="3"/></svg>'''
          Path('assets/xr-loading-screen.svg').write_text(svg); Path('assets/xr-loading-screen-embedded.svg').write_text(svg)
          W,H=1600,900; fw,fh=860,560; photo=Image.open(src).convert('RGB'); photo=ImageEnhance.Contrast(photo).enhance(1.03); photo=ImageEnhance.Color(photo).enhance(1.04); photo=photo.filter(ImageFilter.UnsharpMask(radius=1.1,percent=110,threshold=3)); scale=max(fw/photo.width,fh/photo.height); photo=photo.resize((round(photo.width*scale),round(photo.height*scale)),Image.Resampling.LANCZOS); l=(photo.width-fw)//2; t=(photo.height-fh)//2; photo=photo.crop((l,t,l+fw,t+fh))
          mono='/usr/share/fonts/truetype/dejavu/'; f=ImageFont.truetype(mono+'DejaVuSansMono.ttf',25); fb=ImageFont.truetype(mono+'DejaVuSansMono-Bold.ttf',38); fl=ImageFont.truetype(mono+'DejaVuSansMono-Bold.ttf',56); frames=[]; cyan=(57,229,255); white=(245,255,255)
          for k in range(25):
            q=min(1,(k/24)/.84); im=Image.new('RGB',(W,H),(2,9,17)); d=ImageDraw.Draw(im)
            for y in range(0,H,28):
              for x in range(0,W,28): d.point((x,y),fill=(5,45,61))
            d.text((40,34),'XR PROFILE',font=fb,fill=cyan); d.text((40,76),'SPATIAL COMPUTING',font=f,fill=white); d.text((40,113),'REAL-TIME 3D',font=f,fill=white); d.text((40,150),'COMPUTER VISION',font=f,fill=white); d.text((40,187),'AR / VR / MR',font=f,fill=white); d.text((1260,34),'VIGNESHWARAN B',font=fb,fill=white); d.text((1260,76),'UNITY DEVELOPER',font=f,fill=white); d.text((1260,113),'XR ENGINEER',font=f,fill=white); d.text((1260,150),'INTERACTIVE EXPERIENCES',font=f,fill=white); d.text((1260,187),'BUILDING IMMERSIVE WORLDS',font=f,fill=white)
            d.rounded_rectangle((360,85,1240,665),38,fill=(3,16,27),outline=cyan,width=6); d.rounded_rectangle((370,95,1230,655),28,fill=(0,11,19),outline=cyan,width=3); mask=Image.new('L',(W,H)); md=ImageDraw.Draw(mask); md.rectangle((370,95,370+int(fw*q),655),fill=255); layer=Image.new('RGB',(W,H)); layer.paste(photo,(370,95)); im.paste(layer,(0,0),mask); d=ImageDraw.Draw(im); d.rounded_rectangle((370,95,1230,655),28,outline=cyan,width=3)
            if q<1:
              sx=370+int(fw*q); gl=Image.new('RGBA',(W,H)); gd=ImageDraw.Draw(gl); gd.line((sx,95,sx,655),fill=(*cyan,255),width=6); gd.line((sx-14,95,sx+14,655),fill=(*cyan,75),width=16); im=Image.alpha_composite(im.convert('RGBA'),gl.filter(ImageFilter.GaussianBlur(4))).convert('RGB'); d=ImageDraw.Draw(im)
            for j,s in enumerate(['■ CORE ONLINE','■ ASSETS LOADED','■ PROFILE SYNC','■ READY SOON']): d.text((40,500+j*36),s,font=f,fill=cyan)
            for j,s in enumerate(['● UNITY READY','● XR PIPELINE READY','● MODULES LOADED','● PROFILE READY']): d.text((1260,500+j*36),s,font=f,fill=cyan)
            d.text((800,705),'LOADING...',font=fl,fill=white,anchor='mm'); d.text((800,743),'REVEALING XR PROFILE',font=f,fill=cyan,anchor='mm'); d.rounded_rectangle((180,775,1420,801),13,fill=(6,21,34),outline=cyan,width=3); d.rounded_rectangle((188,783,188+int(1224*q),793),5,fill=cyan); frames.append(im.quantize(colors=256,dither=Image.Dither.NONE))
          frames[0].save('assets/xr-profile-loading.gif',save_all=True,append_images=frames[1:],duration=300,disposal=2,optimize=True,loop=None)
          p=Path('README.md'); s=p.read_text(); s=re.sub(r'<img src="https://raw\.githubusercontent\.com/VigneshwaranECE/VigneshwaranECE/main/assets/xr-profile-loading\.gif(?:\?v=[^"]+)?"[^>]*>','<img src="https://raw.githubusercontent.com/VigneshwaranECE/VigneshwaranECE/main/assets/xr-profile-loading.gif?v=wide860" width="100%" alt="XR profile scanning animation" />',s,count=1); p.write_text(s)
          PY
          python3 /tmp/build.py
      - name: Commit generated template
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/xr-loading-screen.svg assets/xr-loading-screen-embedded.svg assets/xr-profile-loading.gif README.md
          git diff --cached --quiet || git commit -m 'Widen XR profile image box'
          git push
