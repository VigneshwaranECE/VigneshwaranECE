name: Build XR Profile GIF

on:
  push:
    paths:
      - 'assets/Loading Image.jpeg'
      - '.github/workflows/embed-xr-profile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python3 -m pip install --quiet Pillow

      - name: Create one-time XR loading GIF
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from pathlib import Path

          W,H=800,505
          photo=Image.open('assets/Loading Image.jpeg').convert('RGB')
          scale=min(556/photo.width,620/photo.height)
          pw,ph=round(photo.width*scale),round(photo.height*scale)
          photo=photo.resize((pw,ph),Image.Resampling.LANCZOS)
          px,py=(556-pw)//2,(620-ph)//2
          regular=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf',10)
          small=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf',9)
          bold=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf',15)
          title=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf',16)
          frames=[]
          N=25
          for i in range(N):
              t=i/(N-1); reveal=min(1,t/0.82)
              im=Image.new('RGB',(W,H),(2,9,17)); d=ImageDraw.Draw(im)
              for y in range(0,H,14):
                  for x in range(0,W,14): d.point((x,y),fill=(4,48,65))
              cyan=(55,220,255); white=(245,255,255)
              d.text((38,25),'XR PROFILE // INITIALIZING',font=title,fill=cyan)
              for j,s in enumerate(['SPATIAL COMPUTING','REAL-TIME 3D','COMPUTER VISION','AR / VR / MR']): d.text((38,55+j*18),s,font=regular,fill=cyan)
              d.text((620,25),'VIGNESHWARAN B',font=title,fill=cyan)
              for j,s in enumerate(['UNITY DEVELOPER','XR ENGINEER','INTERACTIVE EXPERIENCES','BUILDING IMMERSIVE WORLDS']): d.text((620,55+j*18),s,font=regular,fill=cyan)
              box=(250,38,550,374); d.rounded_rectangle(box,18,fill=(0,15,25),outline=cyan,width=3)
              pb=(255,43,545,369); d.rounded_rectangle(pb,14,fill=(1,5,9))
              if reveal>0:
                  layer=Image.new('RGB',(W,H),(0,0,0)); layer.paste(photo,(255+px,43+py))
                  mask=Image.new('L',(W,H),0); md=ImageDraw.Draw(mask); md.rectangle((255,43,255+int(290*reveal),369),fill=255)
                  rounded=Image.new('L',(W,H),0); ImageDraw.Draw(rounded).rounded_rectangle(pb,14,fill=255)
                  import PIL.ImageChops as C; mask=C.multiply(mask,rounded); im.paste(layer,(0,0),mask)
              d=ImageDraw.Draw(im)
              if reveal<1:
                  sx=255+int(290*reveal)
                  glow=Image.new('RGBA',(W,H),(0,0,0,0)); gd=ImageDraw.Draw(glow); gd.line((sx,43,sx,369),fill=(255,255,255,240),width=3); gd.line((sx-5,43,sx+5,369),fill=(0,220,255,90),width=8); glow=glow.filter(ImageFilter.GaussianBlur(2)); im=Image.alpha_composite(im.convert('RGBA'),glow).convert('RGB'); d=ImageDraw.Draw(im)
              d.line((232,68,232,43,260,43),fill=cyan,width=3); d.line((568,68,568,43,540,43),fill=cyan,width=3); d.line((232,344,232,369,260,369),fill=cyan,width=3); d.line((568,344,568,369,540,369),fill=cyan,width=3)
              for j,s in enumerate(['■ CORE ONLINE','■ ASSETS LOADING','■ PROFILE SYNC','■ READY SOON']): d.text((38,338+j*16),s,font=small,fill=cyan)
              for j,s in enumerate(['● UNITY READY','● XR PIPELINE READY','● MODULES LOADED','● PROFILE READY']): d.text((620,338+j*16),s,font=small,fill=cyan)
              d.text((400,405),'LOADING...',font=bold,fill=white,anchor='mm'); d.text((400,426),'REVEALING XR PROFILE',font=small,fill=cyan,anchor='mm')
              d.rounded_rectangle((130,443,670,458),7,fill=(5,18,29),outline=cyan,width=1); d.rounded_rectangle((134,447,134+int(532*reveal),454),4,fill=(55,220,255))
              for x,p in zip([135,242,349,456,563,665],['0%','20%','40%','60%','80%','100%']): d.text((x,470),p,font=small,fill=cyan,anchor='mm')
              frames.append(im.convert('P',palette=Image.Palette.ADAPTIVE,colors=128))
          out=Path('assets/xr-profile-loading.gif')
          # No loop extension: the GIF plays once and freezes on its final frame.
          frames[0].save(out,save_all=True,append_images=frames[1:],duration=320,disposal=2,optimize=True)

          readme=Path('README.md'); text=readme.read_text(encoding='utf-8')
          old='<img src="https://raw.githubusercontent.com/VigneshwaranECE/VigneshwaranECE/main/assets/xr-loading-screen.svg?v=20260913" width="100%" alt="Animated XR loading screen" />'
          new='<img src="https://raw.githubusercontent.com/VigneshwaranECE/VigneshwaranECE/main/assets/xr-profile-loading.gif?v=1" width="100%" alt="XR profile loading animation" />'
          if old not in text: raise SystemExit('README image reference not found')
          readme.write_text(text.replace(old,new),encoding='utf-8')
          PY

      - name: Commit GIF and README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/xr-profile-loading.gif README.md
          git diff --cached --quiet || git commit -m 'Use one-time XR loading GIF in profile'
          git push
