name: Build XR Profile SVG Template

on:
  push:
    paths:
      - 'assets/Loading Image.jpeg'
      - '.github/workflows/embed-xr-profile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build enlarged SVG template
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          src=Path('assets/Loading Image.jpeg')
          raw=base64.b64encode(src.read_bytes()).decode('ascii')
          svg=f'''<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020914"/><stop offset="1" stop-color="#061522"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="photoClip"><rect x="535" y="115" width="530" height="555" rx="24"/></clipPath><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#0b6078" opacity=".55"/></pattern></defs>
          <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
          <g fill="none" stroke="#08728f" stroke-width="2" opacity=".7"><path d="M0 75H250L300 25H455"/><path d="M1600 75H1350L1300 25H1145"/><path d="M0 825H250L300 875H455"/><path d="M1600 825H1350L1300 875H1145"/></g>
          <g font-family="DejaVu Sans Mono,monospace" letter-spacing="2">
          <text x="15" y="82" fill="#39e5ff" font-size="36" font-weight="700">XR PROFILE</text><rect x="15" y="104" width="125" height="7" rx="3" fill="#39e5ff"/>
          <g fill="#f5ffff" font-size="26" font-weight="600"><text x="15" y="158">SPATIAL COMPUTING</text><text x="15" y="202">REAL-TIME 3D</text><text x="15" y="246">COMPUTER VISION</text><text x="15" y="290">AR / VR / MR</text></g>
          <text x="1190" y="82" fill="#f5ffff" font-size="32" font-weight="700">VIGNESHWARAN B</text><rect x="1190" y="104" width="125" height="7" rx="3" fill="#39e5ff"/>
          <g fill="#f5ffff" font-size="25" font-weight="600"><text x="1190" y="158">UNITY DEVELOPER</text><text x="1190" y="202">XR ENGINEER</text><text x="1190" y="246">INTERACTIVE EXPERIENCES</text><text x="1190" y="290">BUILDING IMMERSIVE WORLDS</text></g></g>
          <g filter="url(#glow)"><rect x="525" y="105" width="550" height="575" rx="32" fill="#03101b" stroke="#39e5ff" stroke-width="5"/></g>
          <g stroke="#39e5ff" stroke-width="8" fill="none"><path d="M525 160V125Q525 105 545 105H590"/><path d="M1010 105H1055Q1075 105 1075 125V160"/><path d="M525 625V660Q525 680 545 680H590"/><path d="M1010 680H1055Q1075 680 1075 660V625"/></g>
          <rect x="535" y="115" width="530" height="555" rx="24" fill="#000b13"/><image x="535" y="115" width="530" height="555" preserveAspectRatio="xMidYMid meet" clip-path="url(#photoClip)" href="data:image/jpeg;base64,{raw}"/><rect x="535" y="115" width="530" height="555" rx="24" fill="none" stroke="#0ce0ff" stroke-width="3"/>
          <g font-family="DejaVu Sans Mono,monospace" font-size="24" font-weight="600" letter-spacing="2" fill="#39e5ff"><text x="15" y="490">■ CORE ONLINE</text><text x="15" y="534">■ ASSETS LOADED</text><text x="15" y="578">■ PROFILE SYNC</text><text x="15" y="622">■ READY SOON</text><text x="1190" y="490">● UNITY READY</text><text x="1190" y="534">● XR PIPELINE READY</text><text x="1190" y="578">● MODULES LOADED</text><text x="1190" y="622">● PROFILE READY</text></g>
          <g font-family="DejaVu Sans Mono,monospace" text-anchor="middle"><text x="800" y="735" fill="#f8ffff" font-size="52" font-weight="700" letter-spacing="9">LOADING...</text><text x="800" y="775" fill="#39e5ff" font-size="25" font-weight="600" letter-spacing="5">REVEALING XR PROFILE</text></g>
          <rect x="180" y="815" width="1240" height="24" rx="12" fill="#061522" stroke="#39e5ff" stroke-width="3"/><rect x="187" y="822" width="620" height="10" rx="5" fill="#39e5ff" filter="url(#glow)"/><g font-family="DejaVu Sans Mono,monospace" font-size="20" font-weight="600" fill="#39e5ff" text-anchor="middle"><text x="180" y="870">0%</text><text x="428" y="870">20%</text><text x="676" y="870">40%</text><text x="924" y="870">60%</text><text x="1172" y="870">80%</text><text x="1420" y="870">100%</text></g>
          </svg>'''
          Path('assets/xr-loading-screen.svg').write_text(svg,encoding='utf-8')
          Path('assets/xr-loading-screen-embedded.svg').write_text(svg,encoding='utf-8')
          PY

      - name: Commit updated SVG template
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/xr-loading-screen.svg assets/xr-loading-screen-embedded.svg
          git diff --cached --quiet || git commit -m 'Remove init text and enlarge XR template text'
          git push
