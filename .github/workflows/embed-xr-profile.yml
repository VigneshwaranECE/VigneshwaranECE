name: Build XR Profile Scan Animation

on:
  push:
    paths:
      - 'assets/Loading Image.jpeg'
      - '.github/workflows/embed-xr-profile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --quiet Pillow
      - name: Build aligned XR template and scan GIF
        run: |
          python3 - <<'PY'
          import base64,re
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont,ImageFilter,ImageEnhance
          src=Path('assets/Loading Image.jpeg'); raw=base64.b64encode(src.read_bytes()).decode('ascii')
          # Left-side text groups intentionally share the exact same x-position (40px).
          svg=f'''<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020914"/><stop offset="1" stop-color="#061522"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="photoClip"><rect x="460" y="105" width="680" height="540" rx="28"/></clipPath><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#0b6078" opacity=".55"/></pattern></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><g fill="none" stroke="#08728f" stroke-width="2" opacity=".7"><path d="M0 75H300L350 25H430"/><path d="M1600 75H1300L1250 25H1170"/><path d="M0 825H300L350 875H430"/><path d="M1600 825H1300L1250 875H1170"/></g><g font-family="DejaVu Sans Mono,monospace" letter-spacing="2"><text x="40" y="82" fill="#39e5ff" font-size="36" font-weight="700">XR PROFILE</text><g fill="#f5ffff" font-size="27" font-weight="600"><text x="40" y="158">SPATIAL COMPUTING</text><text x="40" y="202">REAL-TIME 3D</text><text x="40" y="246">COMPUTER VISION</text><text x="40" y="290">AR / VR / MR</text></g><text x="1180" y="82" fill="#f5ffff" font-size="31" font-weight="700">VIGNESHWARAN B</text><g fill="#f5ffff" font-size="24" font-weight="600"><text x="1180" y="158">UNITY DEVELOPER</text><text x="1180" y="202">XR ENGINEER</text><text x="1180" y="246">INTERACTIVE EXPERIENCES</text><text x="1180" y="290">BUILDING IMMERSIVE WORLDS</text></g></g><g filter="url(#glow)"><rect x="450" y="95" width="700" height="560" rx="38" fill="#03101b" stroke="#39e5ff" stroke-width="6"/></g><g stroke="#39e5ff" stroke-width="9" fill="none"><path d="M450 160V125Q450 95 480 95H540"/><path d="M1060 95H1120Q1150 95 1150 125V160"/><path d="M450 590V625Q450 655 480 655H540"/><path d="M1060 655H1120Q1150 655 1150 625V590"/></g><rect x="460" y="105" width="680" height="540" rx="28" fill="#000b13"/><image x="460" y="105" width="680" height="540" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)" href="data:image/jpeg;base64,{raw}"/><rect x="460" y="105" width="680" height="540" rx="28" fill="none" stroke="#0ce0ff" stroke-width="3"/><g font-family="DejaVu Sans Mono,monospace" font-size="24" font-weight="600" letter-spacing="2" fill="#39e5ff"><text x="40" y="500">■ CORE ONLINE</text><text x="40" y="536">■ ASSETS LOADED</text><text x="40" y="572">■ PROFILE SYNC</text><text x="40" y="608">■ READY SOON</text><text x="1180" y="500">● UNITY READY</text><text x="1180" y="536">● XR PIPELINE READY</text><text x="1180" y="572">● MODULES LOADED</text><text x="1180" y="608">● PROFILE READY</text></g><text x="800" y="720" fill="#f8ffff" font-family="DejaVu Sans Mono,monospace" font-size="54" font-weight="700" letter-spacing="9" text-anchor="middle">LOADING...</text><text x="800" y="758" fill="#39e5ff" font-family="DejaVu Sans Mono,monospace" font-size="25" font-weight="600" letter-spacing="5" text-anchor="middle">REVEALING XR PROFILE</text><rect x="180" y="790" width="1240" height="26" rx="13" fill="#061522" stroke="#39e5ff" stroke-width="3"/><g font-family="DejaVu Sans Mono,monospace" font-size="20" font-weight="600" fill="#39e5ff" text-anchor="middle"><text x="180" y="855">0%</text><text x="428" y="855">20%</text><text x="676" y="855">40%</text><text x="924" y="855">60%</text><text x="1172" y="855">80%</text><text x="1420" y="855">100%</text></g></svg>'''
          Path('assets/xr-loading-screen.svg').write_text(svg,encoding='utf-8'); Path('assets/xr-loading-screen-embedded.svg').write_text(svg,encoding='utf-8')
          W,H=1600,900; base=Image.new('RGB',(W,H),(2,9,17)); photo=Image.open(src).convert('RGB'); photo=ImageEnhance.Contrast(photo).enhance(1.03); photo=ImageEnhance.Color(photo).enhance(1.04); photo=photo.filter(ImageFilter.UnsharpMask(radius=1.1,percent=110,threshold=3)); fw,fh=680,540; scale=max(fw/photo.width,fh/photo.height); photo=photo.resize((round(photo.width*scale),round(photo.height*scale)),Image.Resampling.LANCZOS); left=(photo.width-fw)//2; top=(photo.height-fh)//2; photo=photo.crop((left,top,left+fw,top+fh))
          fonts='/usr/share/fonts/truetype/dejavu/'; F2=ImageFont.truetype(fonts+'DejaVuSansMono.ttf',25); F3=ImageFont.truetype(fonts+'DejaVuSansMono-Bold.ttf',36); F4=ImageFont.truetype(fonts+'DejaVuSansMono-Bold.ttf',54); frames=[]
          for k in range(25):
            reveal=min(1,(k/24)/0.84); im=base.copy(); d=ImageDraw.Draw(im); cyan=(57,229,255); white=(245,255,255)
            for y in range(0,H,28):
              for x in range(0,W,28): d.point((x,y),fill=(5,45,61))
            d.text((40,34),'XR PROFILE',font=F3,fill=cyan); d.text((40,76),'SPATIAL COMPUTING',font=F2,fill=white); d.text((40,113),'REAL-TIME 3D',font=F2,fill=white); d.text((40,150),'COMPUTER VISION',font=F2,fill=white); d.text((40,187),'AR / VR / MR',font=F2,fill=white); d.text((1180,34),'VIGNESHWARAN B',font=F3,fill=white); d.text((1180,76),'UNITY DEVELOPER',font=F2,fill=white); d.text((1180,113),'XR ENGINEER',font=F2,fill=white); d.text((1180,150),'INTERACTIVE EXPERIENCES',font=F2,fill=white); d.text((1180,187),'BUILDING IMMERSIVE WORLDS',font=F2,fill=white)
            d.rounded_rectangle((450,95,1150,655),38,fill=(3,16,27),outline=cyan,width=6); d.rounded_rectangle((460,105,1140,645),28,fill=(0,11,19),outline=cyan,width=3); mask=Image.new('L',(W,H),0); md=ImageDraw.Draw(mask); md.rectangle((460,105,460+int(fw*reveal),645),fill=255); layer=Image.new('RGB',(W,H)); layer.paste(photo,(460,105)); im.paste(layer,(0,0),mask); d=ImageDraw.Draw(im); d.rounded_rectangle((460,105,1140,645),28,outline=cyan,width=3)
            if reveal<1:
              sx=460+int(fw*reveal); glow=Image.new('RGBA',(W,H),(0,0,0,0)); gd=ImageDraw.Draw(glow); gd.line((sx,105,sx,645),fill=(57,229,255,255),width=6); gd.line((sx-14,105,sx+14,645),fill=(57,229,255,75),width=16); glow=glow.filter(ImageFilter.GaussianBlur(4)); im=Image.alpha_composite(im.convert('RGBA'),glow).convert('RGB')
            d=ImageDraw.Draw(im)
            for j,s in enumerate(['■ CORE ONLINE','■ ASSETS LOADED','■ PROFILE SYNC','■ READY SOON']): d.text((40,500+j*36),s,font=F2,fill=cyan)
            for j,s in enumerate(['● UNITY READY','● XR PIPELINE READY','● MODULES LOADED','● PROFILE READY']): d.text((1180,500+j*36),s,font=F2,fill=cyan)
            d.text((800,720),'LOADING...',font=F4,fill=white,anchor='mm'); d.text((800,758),'REVEALING XR PROFILE',font=F2,fill=cyan,anchor='mm'); d.rounded_rectangle((180,790,1420,816),13,fill=(6,21,34),outline=cyan,width=3); d.rounded_rectangle((188,798,188+int(1224*reveal),808),5,fill=cyan)
            for x,s in zip([180,428,676,924,1172,1420],['0%','20%','40%','60%','80%','100%']): d.text((x,855),s,font=F2,fill=cyan,anchor='mm')
            frames.append(im.quantize(colors=256,method=Image.Quantize.MEDIANCUT,dither=Image.Dither.NONE))
          frames[0].save('assets/xr-profile-loading.gif',save_all=True,append_images=frames[1:],duration=300,disposal=2,optimize=True,loop=None)
          p=Path('README.md'); t=p.read_text(encoding='utf-8'); t=re.sub(r'<img src="https://raw\.githubusercontent\.com/VigneshwaranECE/VigneshwaranECE/main/assets/(?:xr-profile-loading\.gif|xr-loading-screen(?:-embedded)?\.svg)(?:\?v=[^"]+)?"[^>]*>','<img src="https://raw.githubusercontent.com/VigneshwaranECE/VigneshwaranECE/main/assets/xr-profile-loading.gif?v=aligned1" width="100%" alt="XR profile scanning animation" />',t,count=1); p.write_text(t,encoding='utf-8')
          PY
      - name: Commit aligned XR template
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/xr-loading-screen.svg assets/xr-loading-screen-embedded.svg assets/xr-profile-loading.gif README.md
          git diff --cached --quiet || git commit -m 'Align left XR profile text'
          git push
