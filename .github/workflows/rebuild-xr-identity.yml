name: Rebuild XR Identity GIF
on:
  push:
    paths: ['.github/workflows/rebuild-xr-identity.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet Pillow
      - name: Generate proper animated identity graphic
        run: |
          cat > /tmp/make.py <<'PY'
          from PIL import Image,ImageDraw,ImageFont,ImageFilter
          import math,re
          W,H=980,760
          C={'bg':(3,10,18),'cyan':(42,232,255),'white':(242,249,255),'purple':(205,88,255),'blue':(55,155,255),'orange':(255,150,40)}
          m='/usr/share/fonts/truetype/dejavu/'
          F=lambda n,b=False: ImageFont.truetype(m+('DejaVuSansMono-Bold.ttf' if b else 'DejaVuSansMono.ttf'),n)
          title=F(38,1); role=F(18,1); sub=F(14); card=F(15,1); small=F(12)
          def glow(im,pts,col,w=3):
            g=Image.new('RGBA',im.size,(0,0,0,0)); d=ImageDraw.Draw(g); d.line(pts,fill=(*col,110),width=w+10,joint='curve'); im.alpha_composite(g.filter(ImageFilter.GaussianBlur(7))); ImageDraw.Draw(im).line(pts,fill=(*col,255),width=w,joint='curve')
          def headset(im,x,y,s,c):
            d=ImageDraw.Draw(im); d.rounded_rectangle((x-45*s,y-23*s,x+45*s,y+23*s),12*s,outline=c,width=max(2,int(4*s))); d.arc((x-58*s,y-43*s,x+58*s,y+43*s),190,350,fill=c,width=max(2,int(3*s))); d.rectangle((x-61*s,y-7*s,x-45*s,y+20*s),fill=c); d.rectangle((x+45*s,y-7*s,x+61*s,y+20*s),fill=c); d.line((x-12*s,y,x+12*s,y),fill=c,width=max(2,int(3*s)))
          def unity(im,x,y,s,c):
            p=[(x,y-42*s),(x+37*s,y-20*s),(x+29*s,y+29*s),(x,y+42*s),(x-29*s,y+29*s),(x-37*s,y-20*s)]; glow(im,p+[p[0]],c,3); glow(im,[(x-29*s,y+29*s),(x+7*s,y-5*s),(x+37*s,y-20*s)],c,3)
          def brain(im,x,y,s,c):
            d=ImageDraw.Draw(im); d.arc((x-43*s,y-42*s,x+2*s,y+42*s),90,270,fill=c,width=max(2,int(4*s))); d.arc((x-2*s,y-42*s,x+43*s,y+42*s),270,90,fill=c,width=max(2,int(4*s))); d.line((x,y-42*s,x,y+42*s),fill=c,width=max(2,int(3*s))); d.arc((x-31*s,y-27*s,x,y-5*s),270,90,fill=c,width=2); d.arc((x,y-5*s,x+31*s,y+17*s),90,270,fill=c,width=2); d.arc((x-31*s,y+4*s,x,y+26*s),270,90,fill=c,width=2)
          def cube(im,x,y,s,c):
            p=[(x,y-38*s),(x+38*s,y-16*s),(x+38*s,y+28*s),(x,y+48*s),(x-38*s,y+28*s),(x-38*s,y-16*s)]; glow(im,p+[p[0]],c,3); glow(im,[(x,y-38*s),(x,y+48*s)],c,2); glow(im,[(x-38*s,y-16*s),(x,y+6*s),(x+38*s,y-16*s)],c,2)
          def crane(im,x,y,s,c):
            glow(im,[(x-48*s,y+40*s),(x+48*s,y+40*s)],c,3); glow(im,[(x-36*s,y+40*s),(x-36*s,y-38*s),(x+42*s,y-38*s)],c,3); glow(im,[(x+18*s,y-38*s),(x+18*s,y+9*s)],c,3); d=ImageDraw.Draw(im); d.arc((x+9*s,y+4*s,x+27*s,y+24*s),0,180,fill=c,width=2); d.rectangle((x-57*s,y+17*s,x-27*s,y+40*s),outline=c,width=2)
          icons={'vr':headset,'unity':unity,'brain':brain,'cube':cube,'crane':crane}
          def make(k):
            im=Image.new('RGBA',(W,H),(*C['bg'],255)); d=ImageDraw.Draw(im)
            for y in range(12,H,28):
              for x in range(12,W,28): d.ellipse((x-1,y-1,x+1,y+1),fill=(7,58,78,150))
            d.text((W//2,45),"HI, I'M",font=sub,fill=C['cyan'],anchor='mm'); d.text((W//2,92),'VIGNESHWARAN B',font=title,fill=C['white'],anchor='mm')
            for typ,txt,x,col in [('vr','XR ENGINEER',175,C['cyan']),('unity','UNITY DEVELOPER',490,C['white']),('brain','XR AI ENGINEER',805,C['cyan'])]:
              icons[typ](im,x,170,0.72*(1+0.05*math.sin(k)),col); d=ImageDraw.Draw(im); d.text((x,235),txt,font=role,fill=C['white'],anchor='mm')
            d.text((W//2,305),'WHAT I DO',font=title,fill=C['cyan'],anchor='mm')
            data=[('vr','XR DEVELOPMENT','AR • VR • MR','Unity • OpenXR',C['cyan']),('brain','XR + AI','Computer Vision','AI • Hand Tracking',C['purple']),('cube','REAL-TIME 3D','Interactive Experiences','Spatial Computing',C['blue']),('crane','INDUSTRIAL XR','Training • Maintenance','Safety',C['orange'])]
            for i,(typ,a,b,c,col) in enumerate(data):
              x=18+i*237; d.rounded_rectangle((x,350,x+215,625),18,fill=(5,16,28,245),outline=col,width=3); icons[typ](im,x+107,420,0.55,col); d.text((x+107,485),a,font=card,fill=col,anchor='mm'); d.text((x+107,535),b,font=small,fill=C['white'],anchor='mm'); d.text((x+107,558),c,font=small,fill=C['white'],anchor='mm'); d.rounded_rectangle((x+72,592,x+143,597),3,fill=col)
            d.text((W//2,700),'BUILDING IMMERSIVE WORLDS',font=sub,fill=C['cyan'],anchor='mm')
            # animated cyan scan pulse
            sx=int((k%8)/7*(W-1)); g=Image.new('RGBA',im.size,(0,0,0,0)); gd=ImageDraw.Draw(g); gd.line((sx,0,sx,H),fill=(*C['cyan'],70),width=3); im.alpha_composite(g.filter(ImageFilter.GaussianBlur(5)))
            return im.convert('RGB')
          fs=[make(i) for i in range(8)]
          fs[0].save('assets/xr-identity-what-i-do.gif',save_all=True,append_images=fs[1:],duration=220,loop=0,optimize=True)
          p='README.md'; s=open(p).read(); s=re.sub(r'(assets/xr-identity-what-i-do\.gif\?v=)\d+',r'\g<1>3',s); open(p,'w').write(s)
          PY
          python3 /tmp/make.py
      - name: Commit generated GIF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/xr-identity-what-i-do.gif README.md
          git diff --cached --quiet || git commit -m 'Generate proper XR identity GIF'
          git push