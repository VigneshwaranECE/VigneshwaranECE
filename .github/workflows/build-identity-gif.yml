name: Build XR Identity GIF
on:
  push:
    paths: ['.github/workflows/build-identity-gif.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet Pillow
      - name: Generate identity GIF with detailed icons
        run: |
          cat > /tmp/make.py <<'PY'
          from PIL import Image,ImageDraw,ImageFont,ImageFilter
          import math,re
          W,H=980,760; bg=(2,10,18); cyan=(40,230,255); white=(245,250,255); purple=(205,85,255); orange=(255,145,25); blue=(50,150,255)
          m='/usr/share/fonts/truetype/dejavu/'; title=ImageFont.truetype(m+'DejaVuSansMono-Bold.ttf',38); role=ImageFont.truetype(m+'DejaVuSansMono-Bold.ttf',18); sub=ImageFont.truetype(m+'DejaVuSansMono.ttf',14); card=ImageFont.truetype(m+'DejaVuSansMono-Bold.ttf',15); small=ImageFont.truetype(m+'DejaVuSansMono.ttf',12)
          def glow(im,pts,col,w=3):
            g=Image.new('RGBA',im.size,(0,0,0,0)); q=ImageDraw.Draw(g); q.line(pts,fill=(*col,110),width=w+10,joint='curve'); im.alpha_composite(g.filter(ImageFilter.GaussianBlur(7))); ImageDraw.Draw(im).line(pts,fill=(*col,255),width=w,joint='curve')
          def vr(im,x,y,s,c):
            d=ImageDraw.Draw(im); d.rounded_rectangle((x-45*s,y-23*s,x+45*s,y+23*s),12*s,outline=c,width=max(2,int(4*s))); d.line((x-25*s,y+23*s,x-33*s,y+36*s),fill=c,width=max(2,int(3*s))); d.line((x+25*s,y+23*s,x+33*s,y+36*s),fill=c,width=max(2,int(3*s))); d.line((x-11*s,y,x+11*s,y),fill=c,width=max(2,int(3*s))); d.arc((x-58*s,y+12*s,x+58*s,y+40*s),180,360,fill=c,width=max(2,int(3*s)))
          def unity(im,x,y,s,c):
            p=[(x,y-42*s),(x+37*s,y-20*s),(x+29*s,y+29*s),(x,y+42*s),(x-29*s,y+29*s),(x-37*s,y-20*s)]; glow(im,p+[p[0]],c,max(2,int(3*s))); glow(im,[(x-29*s,y+29*s),(x+8*s,y-5*s),(x+37*s,y-20*s)],c,max(2,int(3*s)))
          def brain(im,x,y,s,c):
            d=ImageDraw.Draw(im); d.arc((x-43*s,y-42*s,x+2*s,y+42*s),90,270,fill=c,width=max(2,int(4*s))); d.arc((x-2*s,y-42*s,x+43*s,y+42*s),270,90,fill=c,width=max(2,int(4*s))); d.line((x,y-42*s,x,y+42*s),fill=c,width=max(2,int(3*s)))
            for yy in (-24,0,24): d.arc((x-31*s,y+(yy-10)*s,x,y+(yy+10)*s),270,90,fill=c,width=max(2,int(2*s))); d.arc((x,y+(yy-10)*s,x+31*s,y+(yy+10)*s),90,270,fill=c,width=max(2,int(2*s)))
          def cube(im,x,y,s,c):
            p=[(x,y-38*s),(x+38*s,y-16*s),(x+38*s,y+28*s),(x,y+48*s),(x-38*s,y+28*s),(x-38*s,y-16*s)]; glow(im,p+[p[0]],c,max(2,int(3*s))); glow(im,[(x,y-38*s),(x,y+48*s)],c,2); glow(im,[(x-38*s,y-16*s),(x,y+7*s),(x+38*s,y-16*s)],c,2)
          def crane(im,x,y,s,c):
            glow(im,[(x-48*s,y+42*s),(x+48*s,y+42*s)],c,3); glow(im,[(x-36*s,y+42*s),(x-36*s,y-38*s),(x+42*s,y-38*s)],c,3); glow(im,[(x+18*s,y-38*s),(x+18*s,y+10*s)],c,3); d=ImageDraw.Draw(im); d.arc((x+9*s,y+5*s,x+27*s,y+25*s),0,180,fill=c,width=2); d.rectangle((x-58*s,y+17*s,x-27*s,y+42*s),outline=c,width=2)
          def make(k):
            im=Image.new('RGBA',(W,H),(*bg,255)); d=ImageDraw.Draw(im)
            for y in range(10,H,28):
              for x in range(10,W,28): d.ellipse((x-1,y-1,x+1,y+1),fill=(7,60,80,130))
            d.text((W//2,48),'HI, I\'M',font=sub,fill=cyan,anchor='mm'); d.text((W//2,92),'VIGNESHWARAN B',font=title,fill=white,anchor='mm'); d.text((295,50),'‹‹',font=title,fill=cyan,anchor='mm'); d.text((685,50),'››',font=title,fill=cyan,anchor='mm')
            for typ,txt,col,x in [('vr','XR ENGINEER',cyan,175),('unity','UNITY DEVELOPER',white,490),('brain','XR AI ENGINEER',cyan,805)]:
              s=1+0.05*math.sin(k*1.2)
              {'vr':vr,'unity':unity,'brain':brain}[typ](im,x,170,s*.72,col); d=ImageDraw.Draw(im); d.text((x,235),txt,font=role,fill=white,anchor='mm')
            glow(im,[(240,170),(320,170)],cyan,2); glow(im,[(660,170),(740,170)],cyan,2); d=ImageDraw.Draw(im); d.text((W//2,305),'⚡  WHAT I DO',font=title,fill=cyan,anchor='mm')
            data=[('vr','XR DEVELOPMENT','AR  •  VR  •  MR','Unity  •  OpenXR',cyan),('brain','XR + AI','Computer Vision','AI  •  Hand Tracking',purple),('cube','REAL-TIME 3D','Interactive Experiences','Spatial Computing',blue),('crane','INDUSTRIAL XR','Training  •  Maintenance','Safety',orange)]
            for x,(typ,a,b,c,col) in zip([18,255,492,729],data):
              d.rounded_rectangle((x,350,x+215,625),18,fill=(4,15,27,240),outline=col,width=3); {'vr':vr,'brain':brain,'cube':cube,'crane':crane}[typ](im,x+107,420,.55,col); d=ImageDraw.Draw(im); d.text((x+107,485),a,font=card,fill=col,anchor='mm'); d.text((x+107,535),b,font=small,fill=white,anchor='mm'); d.text((x+107,558),c,font=small,fill=white,anchor='mm'); d.rounded_rectangle((x+72,592,x+143,597),3,fill=col)
            d.text((W//2,700),'BUILDING IMMERSIVE WORLDS',font=sub,fill=cyan,anchor='mm'); g=Image.new('RGBA',im.size,(0,0,0,0)); gd=ImageDraw.Draw(g); sx=int(k/5*(W-1)); gd.line((sx,0,sx,H),fill=(*cyan,55),width=2); im.alpha_composite(g.filter(ImageFilter.GaussianBlur(4))); return im.convert('RGB')
          fs=[make(i) for i in range(6)]; fs[0].save('assets/xr-identity-what-i-do.gif',save_all=True,append_images=fs[1:],duration=260,loop=0,optimize=True)
          p='README.md'; s=open(p).read(); s=re.sub(r'(assets/xr-identity-what-i-do\.gif\?v=)\d+',r'\g<1>2',s); open(p,'w').write(s)
          PY
          python3 /tmp/make.py
      - name: Commit generated GIF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/xr-identity-what-i-do.gif README.md
          git diff --cached --quiet || git commit -m 'Regenerate XR identity GIF with detailed icons'
          git push
