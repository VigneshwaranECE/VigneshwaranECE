name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake GIF
        uses: Platane/snk@v3
        with:
          github_user_name: VigneshwaranECE
          outputs: |
            assets/github-snake.gif?palette=github-dark&color_snake=%2339ff88&color_background=%230d1117

      - name: Commit snake animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.gif
          git diff --cached --quiet || git commit -m "Update GitHub contribution snake animation"
          git push
