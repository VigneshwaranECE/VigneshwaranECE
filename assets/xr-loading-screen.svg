<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
<defs>
  <radialGradient id="bg"><stop stop-color="#101b2d"/><stop offset="1" stop-color="#03070d"/></radialGradient>
  <linearGradient id="bar"><stop stop-color="#00eaff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="photoClip"><rect x="330" y="100" width="540" height="540" rx="270"><animate attributeName="r" values="0;0;270;270;270" dur="7s" repeatCount="indefinite"/></rect></clipPath>
  <mask id="reveal"><rect x="300" y="70" width="600" height="600" fill="black"/><circle cx="600" cy="370" r="0" fill="white"><animate attributeName="r" values="0;0;390;390;390" dur="7s" repeatCount="indefinite"/></circle></mask>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<g opacity=".25" stroke="#00d9ff"><circle cx="600" cy="370" r="300" fill="none"/><circle cx="600" cy="370" r="330" fill="none" stroke-dasharray="3 18"><animateTransform attributeName="transform" type="rotate" from="0 600 370" to="360 600 370" dur="12s" repeatCount="indefinite"/></circle></g>
<g mask="url(#reveal)"><image href="https://raw.githubusercontent.com/VigneshwaranECE/VigneshwaranECE/main/assets/Loading%20Image.jpeg" x="300" y="70" width="600" height="600" preserveAspectRatio="xMidYMid slice"/></g>
<circle cx="600" cy="370" r="300" fill="none" stroke="#00d9ff" stroke-width="4" opacity=".8" filter="url(#glow)"/>
<circle cx="600" cy="370" r="320" fill="none" stroke="#00d9ff" stroke-width="2" stroke-dasharray="12 18"><animateTransform attributeName="transform" type="rotate" from="0 600 370" to="360 600 370" dur="8s" repeatCount="indefinite"/></circle>
<g fill="#00eaff" filter="url(#glow)"><circle cx="600" cy="50" r="5"><animate attributeName="cy" values="50;690;50" dur="7s" repeatCount="indefinite"/></circle></g>
<text x="600" y="735" fill="#fff" text-anchor="middle" font-family="monospace" font-size="42" font-weight="bold" letter-spacing="9">LOADING...</text>
<text x="600" y="765" fill="#63eaff" text-anchor="middle" font-family="monospace" font-size="13" letter-spacing="5">INITIALIZING XR PROFILE</text>
<rect x="270" y="795" width="660" height="12" rx="6" fill="#111c2b" stroke="#00d9ff"/>
<rect x="276" y="799" width="0" height="4" rx="2" fill="url(#bar)"><animate attributeName="width" values="0;0;648;648;0" keyTimes="0;.1;.72;.9;1" dur="7s" repeatCount="indefinite"/></rect>
<g fill="#63eaff" font-family="monospace" font-size="11"><text x="270" y="830">SYSTEM</text><text x="930" y="830" text-anchor="end">XR CORE ONLINE</text></g>
</svg>