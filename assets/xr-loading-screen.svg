<!-- clean portrait: full image preserved, no crop -->
<rect x="480" y="72" width="576" height="640" rx="36" fill="#00101c" stroke="#00dfff" stroke-width="3" opacity=".95" filter="url(#soft)"/>
<rect x="490" y="82" width="556" height="620" rx="28" fill="#07131d"/>
<g clip-path="url(#revealClip)">
 <image href="https://raw.githubusercontent.com/VigneshwaranECE/VigneshwaranECE/main/assets/Loading%20Image.jpeg" x="490" y="82" width="556" height="620" preserveAspectRatio="xMidYMid meet"/>
</g>
<!-- reveal scan beam -->
<rect x="490" y="82" width="556" height="4" fill="#ffffff" opacity="0">
 <animate attributeName="y" values="82;82;698;698;82" keyTimes="0;.08;.72;.9;1" dur="8s" repeatCount="indefinite"/>
 <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.72;.9;1" dur="8s" repeatCount="indefinite"/>
</rect>
<rect x="490" y="82" width="556" height="30" fill="#00eaff" opacity="0" filter="url(#glow)">
 <animate attributeName="y" values="82;82;688;688;82" keyTimes="0;.08;.72;.9;1" dur="8s" repeatCount="indefinite"/>
 <animate attributeName="opacity" values="0;.18;.18;0;0" keyTimes="0;.08;.72;.9;1" dur="8s" repeatCount="indefinite"/>
</rect>

<!-- clean frame brackets -->
<g fill="none" stroke="#00eaff" stroke-width="4" filter="url(#glow)">
 <path d="M458 126 V82 H505 M1078 126 V82 H1033 M458 658 V702 H505 M1078 658 V702 H1033"/>
</g>
<rect x="490" y="82" width="556" height="620" rx="28" fill="none" stroke="#00dfff" stroke-width="2" opacity=".7"/>

