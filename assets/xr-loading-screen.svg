<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 970">
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#07182a"/><stop offset=".55" stop-color="#03101d"/><stop offset="1" stop-color="#01060d"/></radialGradient>
  <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#00bfff"/><stop offset=".5" stop-color="#00ffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#0780a5" opacity=".35"/></pattern>
  <clipPath id="photoFrame"><rect x="490" y="82" width="556" height="620" rx="28"/></clipPath>
  <clipPath id="revealClip"><rect x="490" y="82" width="556" height="620" rx="28"><animate attributeName="height" values="0;0;620;620;0" keyTimes="0;.08;.72;.9;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
</defs>

<rect width="1536" height="970" fill="url(#bg)"/>
<rect x="20" y="20" width="1496" height="930" rx="34" fill="url(#dots)" opacity=".45"/>

<!-- subtle futuristic corner geometry -->
<g fill="none" stroke="#087ea5" opacity=".35">
 <path d="M0 120 L120 0 M0 165 L165 0 M1536 120 L1416 0 M1536 165 L1371 0 M0 850 L120 970 M0 805 L165 970 M1536 850 L1416 970 M1536 805 L1371 970"/>
</g>

