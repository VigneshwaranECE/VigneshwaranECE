<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">XR System Interface</title><desc id="d">Animated spatial computing interface with rotating XR rings and scanning grid.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#00f0ff"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff3cac"/></linearGradient><radialGradient id="b"><stop stop-color="#111b46"/><stop offset="1" stop-color="#050816"/></radialGradient><filter id="gl"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="p" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#20305c" opacity=".5"/></pattern></defs><rect width="1200" height="420" rx="30" fill="url(#b)"/><rect width="1200" height="420" rx="30" fill="url(#p)"/><g fill="none" stroke="url(#g)" filter="url(#gl)"><circle cx="600" cy="205" r="115" stroke-width="2" stroke-dasharray="12 9"><animateTransform attributeName="transform" type="rotate" from="0 600 205" to="360 600 205" dur="9s" repeatCount="indefinite"/></circle><ellipse cx="600" cy="205" rx="180" ry="62" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0 600 205" to="360 600 205" dur="6s" repeatCount="indefinite"/></ellipse><ellipse cx="600" cy="205" rx="180" ry="62" stroke-width="1"><animateTransform attributeName="transform" type="rotate" from="360 600 205" to="0 600 205" dur="4s" repeatCount="indefinite"/></ellipse><path d="M390 205H810M600 95V315" stroke-width="1" opacity=".45"/><circle cx="600" cy="205" r="24" stroke-width="3"><animate attributeName="r" values="18;30;18" dur="2s" repeatCount="indefinite"/></circle><circle cx="600" cy="205" r="7" fill="#00f0ff"><animate attributeName="opacity" values=".3;1;.3" dur="1s" repeatCount="indefinite"/></circle></g><g font-family="monospace" text-anchor="middle"><text x="600" y="52" fill="#52658f" font-size="11" letter-spacing="5">SPATIAL COMPUTING // SYSTEM ONLINE</text><text x="600" y="155" fill="#fff" font-size="39" font-weight="700" letter-spacing="8">XR ENGINEER</text><text x="600" y="188" fill="#00f0ff" font-size="14" letter-spacing="4">AR • VR • MR • COMPUTER VISION</text><text x="600" y="360" fill="#7182aa" font-size="11" letter-spacing="3">UNITY  /  OPENXR  /  PICO SDK  /  META XR  /  WEBXR</text></g><g font-family="monospace" font-size="10" fill="#52658f"><text x="35" y="45">XR://01</text><text x="1030" y="45">TRACKING: ACTIVE</text><text x="35" y="395">REAL-TIME 3D</text><text x="1035" y="395">BUILD • EXPLORE • CREATE</text></g><g stroke="url(#g)" opacity=".35"><path d="M0 330 C260 250 420 400 610 310 S930 240 1200 325" fill="none"><animate attributeName="d" dur="5s" repeatCount="indefinite" values="M0 330 C260 250 420 400 610 310 S930 240 1200 325;M0 300 C260 390 420 250 610 350 S930 290 1200 300;M0 330 C260 250 420 400 610 310 S930 240 1200 325"/></path></g><rect x="1" y="1" width="1198" height="418" rx="29" fill="none" stroke="#24345e"/></svg>