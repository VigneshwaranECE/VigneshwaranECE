<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Vigneshwaran B — XR Engineer</title>
<desc id="desc">Animated futuristic spatial computing hero banner.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#0b1026"/></linearGradient>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#00f0ff"/><stop offset="1" stop-color="#8a5cff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1b2a50" stroke-width="1" opacity=".45"/></pattern>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<rect width="1200" height="360" rx="28" fill="url(#grid)"/>
<g fill="none" stroke="url(#line)" filter="url(#glow)" opacity=".8">
  <ellipse cx="160" cy="180" rx="100" ry="100" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0 160 180" to="360 160 180" dur="12s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="160" cy="180" rx="100" ry="38" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0 160 180" to="360 160 180" dur="7s" repeatCount="indefinite"/></ellipse>
  <path d="M60 180H260M160 80V280" stroke-width="1" opacity=".5"/>
  <circle cx="160" cy="180" r="8" fill="#00f0ff"><animate attributeName="r" values="5;13;5" dur="2s" repeatCount="indefinite"/></circle>
</g>
<g fill="none" stroke="#00f0ff" opacity=".25"><path d="M0 300 C250 220 350 340 560 260 S900 180 1200 270" stroke-width="2"><animate attributeName="d" dur="5s" repeatCount="indefinite" values="M0 300 C250 220 350 340 560 260 S900 180 1200 270;M0 270 C250 340 350 220 560 300 S900 250 1200 300;M0 300 C250 220 350 340 560 260 S900 180 1200 270"/></path></g>
<g font-family="monospace" text-anchor="middle">
  <text x="600" y="130" fill="#ffffff" font-size="46" font-weight="700" letter-spacing="7">VIGNESHWARAN B</text>
  <text x="600" y="180" fill="#00f0ff" font-size="27" font-weight="700" letter-spacing="8">XR ENGINEER</text>
  <text x="600" y="222" fill="#aeb9d8" font-size="15" letter-spacing="4">AR • VR • MR • SPATIAL COMPUTING</text>
  <text x="600" y="270" fill="#68789e" font-size="12" letter-spacing="3">INITIALIZING IMMERSIVE SYSTEMS...</text>
</g>
<g fill="#00f0ff"><circle cx="1050" cy="80" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" repeatCount="indefinite"/></circle><circle cx="1100" cy="120" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle><circle cx="1020" cy="300" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" repeatCount="indefinite"/></circle></g>
<rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#1d315b"/>
</svg>
